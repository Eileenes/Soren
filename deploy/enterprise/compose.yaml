services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: soren
      POSTGRES_DB: soren
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - enterprise_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soren -d soren"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  enterprise:
    build:
      context: ../..
      dockerfile: deploy/enterprise/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://soren:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/soren?sslmode=disable
      ENTERPRISE_PUBLIC_URL: https://${SOREN_ENTERPRISE_DOMAIN:?Set SOREN_ENTERPRISE_DOMAIN}
    volumes:
      - enterprise_data:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8091/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
  edge:
    image: caddy:2-alpine
    environment:
      SOREN_ENTERPRISE_DOMAIN: ${SOREN_ENTERPRISE_DOMAIN:?Set SOREN_ENTERPRISE_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - enterprise_caddy_data:/data
      - enterprise_caddy_config:/config
    depends_on:
      enterprise:
        condition: service_healthy
    restart: unless-stopped
volumes:
  enterprise_db:
  enterprise_data:
  enterprise_caddy_data:
  enterprise_caddy_config:
