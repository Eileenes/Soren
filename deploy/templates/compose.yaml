services:
  templates:
    build:
      context: ../..
      dockerfile: deploy/templates/Dockerfile
    environment:
      TEMPLATE_PUBLIC_URL: https://${SOREN_TEMPLATE_DOMAIN:?Set SOREN_TEMPLATE_DOMAIN}
    volumes:
      - template_data:/data
      - ./publishers.json:/config/publishers.json:ro
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1
    security_opt: ["no-new-privileges:true"]
    read_only: true
    cap_drop: ["ALL"]
  edge:
    image: caddy:2-alpine
    environment:
      SOREN_TEMPLATE_DOMAIN: ${SOREN_TEMPLATE_DOMAIN:?Set SOREN_TEMPLATE_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on: [templates]
volumes:
  template_data:
  caddy_data:
  caddy_config:
